{{define "layout"}}<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}}</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: Canvas; color: CanvasText;
  }
  main { width: min(34rem, 92vw); padding: 2rem 0; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1rem; color: color-mix(in srgb, CanvasText 70%, Canvas); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
  button {
    width: 100%; text-align: left; padding: .75rem 1rem; font: inherit; cursor: pointer;
    border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas); border-radius: .5rem;
    background: Canvas; color: CanvasText;
  }
  button:hover { border-color: color-mix(in srgb, CanvasText 50%, Canvas); }
  .who { font-weight: 600; }
  .id { font-variant-numeric: tabular-nums; color: color-mix(in srgb, CanvasText 55%, Canvas); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem 1rem; margin: 0; }
  dt { color: color-mix(in srgb, CanvasText 55%, Canvas); }
  dd { margin: 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
</style>
<main>{{template "body" .}}</main>
</html>{{end}}
