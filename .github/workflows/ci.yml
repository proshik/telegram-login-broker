name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read from go.mod so the toolchain never silently drifts from the one
          # the code was written against.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        # -race because the store is one mutex over two maps and the key set is
        # shared across requests; a data race there would be a silent wrong
        # identity, not a crash.
        run: go test -race ./...

  image:
    # Only tags. The plan is explicit that this image must be pinned rather than
    # rolling: an identity provider that quietly moves forward is not what
    # anybody wants at three in the morning.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The exact tag and the immutable digest. Deliberately no "latest":
          # deployments pin a tag, and a moving target defeats that.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Without this the action adds "latest" on its own to every semver tag.
          flavor: |
            latest=false

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # arm64 as well: the deployment target and the laptop it is debugged
          # from are not the same architecture.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
